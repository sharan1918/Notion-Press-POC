apiVersion: v1
kind: Namespace
metadata:
  name: notion-press

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notionpress-backend
  namespace: notion-press
  labels:
    app: notionpress-backend
    tier: api
spec:
  # 4 Replicas: High availability across worker nodes
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notionpress-backend
  template:
    metadata:
      labels:
        app: notionpress-backend
        tier: api
    spec:
      # Pod Anti-Affinity: Distribute pods across different worker nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - notionpress-backend
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: backend-service
          # Uses your real built Notion Press backend image loaded into Kind
          image: notionpress-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: ENVIRONMENT
              value: "development"
            - name: API_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: notionpress-secrets
                  key: API_AUTH_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notionpress-secrets
                  key: OPENROUTER_API_KEY
            - name: OPENROUTER_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: OPENROUTER_PRIMARY_MODEL
              value: "google/gemini-2.5-flash"
            - name: OPENROUTER_SECONDARY_MODEL
              value: "openai/gpt-4o"
            - name: OPENROUTER_TERTIARY_MODEL
              value: "openai/gpt-4o-mini"
            - name: OPENROUTER_QUATERNARY_MODEL
              value: "meta-llama/llama-3.3-70b-instruct"
            - name: OPENROUTER_EMBEDDING_MODEL
              value: "google/gemini-embedding-001"
            - name: CORS_ORIGINS
              value: "http://localhost:5173,https://notion-press-poc.vercel.app,*"
            - name: TRIAGE_CONCURRENCY
              value: "2"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Sized for Python + ChromaDB ONNX embeddings
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Health & Liveness Probes
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
